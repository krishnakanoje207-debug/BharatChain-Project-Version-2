# BharatChain local infrastructure stack.
# Requires Docker Desktop. Bring up with:  npm run infra:up   (from repo root)
#
# Services: Postgres (app DB), Redis, Kafka (KRaft), IPFS + Graph Node, MinIO.
# Graph Node reaches the Hardhat node running on the HOST via host.docker.internal:8545.

name: bharatchain

services:
  # ---------------------------------------------------------------- App database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bharat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bharat}
      POSTGRES_DB: ${POSTGRES_DB:-bharatchain}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bharat} -d ${POSTGRES_DB:-bharatchain}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------- Sessions / OTP / cache
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------- Event bus (KRaft, no Zookeeper)
  kafka:
    image: apache/kafka:3.7.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
      # INTERNAL is for in-Docker clients; EXTERNAL is for host clients (backend on localhost).
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/var/lib/kafka/data

  # --------------------------------------------------------- Document storage (S3)
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------- IPFS
  ipfs:
    image: ipfs/kubo:latest
    restart: unless-stopped
    ports:
      - "5001:5001"   # API (used by Graph Node)
      - "8080:8080"   # gateway
    volumes:
      - ipfsdata:/data/ipfs

  # ------------------------------------------------ Dedicated Postgres for Graph Node
  graph-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: graph
      POSTGRES_PASSWORD: graph
      POSTGRES_DB: graph
      # Graph Node requires C locale collation.
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - graphpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph -d graph"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------- The Graph indexer (Phase 6)
  graph-node:
    image: graphprotocol/graph-node:latest
    restart: unless-stopped
    depends_on:
      graph-postgres:
        condition: service_healthy
      ipfs:
        condition: service_started
    ports:
      - "8000:8000"   # GraphQL (queries)
      - "8001:8001"   # GraphQL (subscriptions)
      - "8020:8020"   # JSON-RPC (subgraph deploy)
      - "8030:8030"   # subgraph indexing status
      - "8040:8040"   # metrics
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      postgres_host: graph-postgres
      postgres_user: graph
      postgres_pass: graph
      postgres_db: graph
      ipfs: "ipfs:5001"
      # Points at the Hardhat node running on the host. Subgraph network name = "hardhat".
      ethereum: "hardhat:http://host.docker.internal:8545"
      GRAPH_LOG: info

volumes:
  pgdata:
  redisdata:
  kafkadata:
  miniodata:
  ipfsdata:
  graphpgdata:
